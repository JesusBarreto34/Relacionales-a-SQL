<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Material Login</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
--primary:#6750A4;
--surface:#ffffff;
--bg:#F6F4FE;
--text:#1C1B1F;
--outline:#CAC4D0;
}

body.dark{
--surface:#1E1B22;
--bg:#131217;
--text:#FFFFFF;
--outline:#5B5765;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Roboto;
}

body{
background:var(--bg);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
transition:.3s;
}

.phone{
width:360px;
height:760px;

background:var(--surface);

border-radius:30px;

padding:28px;

box-shadow:0 20px 50px rgba(0,0,0,.25);

overflow:hidden;
}

.header{
display:flex;
justify-content:flex-end;
}

.theme{
width:45px;
height:45px;

border:none;

border-radius:50%;

background:var(--primary);

color:white;

cursor:pointer;
}

.page{
display:none;
}

.active{
display:block;
}

h1{
margin-top:40px;

color:var(--text);

font-size:32px;
}

.sub{
margin-top:10px;

color:gray;

margin-bottom:35px;
}

.input{

margin-bottom:18px;

}

input{

width:100%;

padding:18px;

border-radius:14px;

border:1px solid var(--outline);

background:transparent;

color:var(--text);

font-size:15px;

}

.mainBtn{

width:100%;

padding:16px;

border:none;

border-radius:40px;

background:var(--primary);

color:white;

font-size:16px;

font-weight:500;

margin-top:10px;

cursor:pointer;

}

.outlineBtn{

margin-top:15px;

width:100%;

padding:15px;

border-radius:40px;

background:none;

border:1px solid var(--outline);

color:var(--text);

font-size:15px;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;

gap:10px;

}

.link{

margin-top:25px;

text-align:center;

color:var(--primary);

cursor:pointer;

}

.icon{
font-size:18px;
}

</style>
</head>

<body>

<div class="phone">

<div class="header">

<button
class="theme"
onclick="theme()">

🌙

</button>

</div>

<!-- LOGIN -->

<div
id="login"
class="page active">

<h1>Bienvenido</h1>

<div class="sub">
Inicia sesión para continuar
</div>

<div class="input">
<input type="email" placeholder="Correo">
</div>

<div class="input">
<input type="password" placeholder="Contraseña">
</div>

<button class="mainBtn">
Iniciar sesión
</button>

<button class="outlineBtn">

<span class="icon">G</span>

Continuar con Google

</button>

<button class="outlineBtn">

<span class="icon"></span>

Continuar con Apple

</button>

<div
class="link"

onclick="show('register')">

Crear cuenta

</div>

</div>

<!-- REGISTRO -->

<div
id="register"
class="page">

<h1>Crear cuenta</h1>

<div class="sub">

Regístrate

</div>

<div class="input">
<input placeholder="Nombre">
</div>

<div class="input">
<input placeholder="Correo">
</div>

<div class="input">
<input type="password" placeholder="Contraseña">
</div>

<button class="mainBtn">

Registrarse

</button>

<div
class="link"

onclick="show('login')">

Volver

</div>

</div>

</div>

<script>

function show(page){

document
.querySelectorAll(".page")
.forEach(e=>
e.classList.remove("active"));

document
.getElementById(page)
.classList.add("active");

}

function theme(){

document
.body
.classList.toggle("dark");

}

</script>

</body>
</html>
